name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELAN_VER: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  build:
    runs-on: ubuntu-latest
    # Mathlib is the cameronfreer/mathlib4 fork required by InfinitaryLogic, so the public
    # Mathlib cache misses the ~2100 modules downstream of the fork's changes.  Those, plus
    # InfinitaryLogic itself, are built once per dependency pin and then carried between runs
    # by the `deps` GitHub cache below; a cold run (new pin) is slow, a warm run takes minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install elan (pinned + checksum) and the toolchain
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      # Dependency outputs (`.lake/packages`: Mathlib fork, InfinitaryLogic,
      # ComputableModelTheory, and the small libraries), keyed on the two pins only.  Any
      # branch restores the newest cache for its pins; it is saved by whichever run first
      # builds a new pin, so a repin PR warms itself and `main` inherits the result.
      # This step only looks the entry up (nothing is downloaded), so that the disk cleanup
      # below can be decided before anything is written to disk; the restore follows it.
      - name: Look up dependency cache
        id: deps-lookup
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          lookup-only: true

      - name: Measure free disk space
        id: disk
        run: |
          df -h /
          echo "avail-gb=$(df --output=avail -B1G / | tail -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # The cold path (dependency cache missed) restores nothing and then fetches the Mathlib
      # cache of the pin and builds the dependencies, which needs the room, so the cleanup
      # always runs there, as before (the toolchain install above it is unaffected).
      # The warm path needs room for the restored dependency cache: a 2.1 GB archive that is
      # extracted to about 7.7 GB (both on disk during extraction, so a peak of about 10 GB),
      # plus under 0.1 GB of root build outputs; the sketch checks and audits write nothing
      # large.  The cleanup is therefore also run whenever less than 12 GB is free, and is
      # skipped only on a hit with at least 12 GB free (it takes up to 1.5 minutes).  The
      # cleanup drops the large preinstalled toolchains we never use.
      - name: Free disk space
        if: >-
          steps.deps-lookup.outputs.cache-hit != 'true' ||
          fromJSON(steps.disk.outputs.avail-gb) < 12
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Same key as the look-up.  If the look-up found the entry but the restore does not
      # (evicted in between), fail rather than take the cold path without the cleanup above;
      # a re-run then takes the cold path with the cleanup.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: ${{ steps.deps-lookup.outputs.cache-primary-key }}
          fail-on-cache-miss: ${{ steps.deps-lookup.outputs.cache-hit == 'true' }}

      # The project's own outputs (`.lake/build`), keyed on the pins plus the exact commit,
      # with a prefix fallback to the most recent build for the same pins (the prefix includes
      # the hash of `lean-toolchain` and `lake-manifest.json`, so a build made against other
      # pins is never restored).  `lake build` re-checks every module's trace against its
      # inputs, so a stale restore only costs rebuilding the changed modules and never skips
      # a check.
      - name: Restore root build cache
        id: root-cache
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Only on a cold dependency cache: fetch the public Mathlib cache for the modules the
      # fork shares with upstream, then compile InfinitaryLogic, the classical entry module of
      # ComputableModelTheory, and the uncached Mathlib modules they need, so that
      # the saved dependency cache is complete.  (The main build only compiles what the library
      # imports, which would leave later runs rebuilding whatever this commit happened not to
      # import.)
      - name: Fetch Mathlib cache and build dependencies (cold dependency cache only)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          lake exe cache get
          lake build InfinitaryLogic
          lake build ComputableModelTheory.Classical

      - name: Build
        run: lake build

      # The classical entry module of ComputableModelTheory (its eight Mathlib-only classical
      # modules: representative ages, extension-rich families and direct limits, Fraïssé
      # existence, rooted extension, orbit isolation, countable prime structures, named
      # parameters) is built on every run, cache hit or not, so that a dependency cache saved
      # before it was advertised cannot leave the pinned interfaces unverified.
      - name: Build the classical entry module of ComputableModelTheory
        run: lake build ComputableModelTheory.Classical

      # Save the dependency cache right after a successful build, before the sketch checks and
      # the audits, so a failure in either cannot discard a valid cache.
      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/packages
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Saved on every run whose exact key missed, pull requests included, so that successive
      # commits on one pull request rebuild only the changed modules.  GitHub scopes a cache to
      # the ref that saved it: a pull request's entries (ref `refs/pull/<n>/merge`) are
      # visible to later runs of that pull request only, never to `main` or to other pull
      # requests, while `main`'s entries are visible to every pull request.  The repository
      # limit is 10 GB, evicting least-recently-used entries.  An entry here is about 7.5 MB
      # compressed against 2.1 GB for a dependency cache, so even with four dependency caches
      # present (8.4 GB) about 200 build entries fit; their pressure on the dependency caches
      # is negligible.
      - name: Save root build cache
        if: steps.root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: ${{ steps.root-cache.outputs.cache-primary-key }}

      # The roadmap's sketches are outside the library build but must keep elaborating against
      # the pinned dependencies (their `#check`s of upstream entry points fail on a pin bump
      # that removes one).  `Suggested.lean` and `SuggestedCompanions.lean` have deliberate
      # `sorry`s, so they are checked without warnings-as-errors.  Run after the cache saves, so a
      # failing sketch check cannot discard a freshly built dependency cache.
      - name: Check the roadmap sketches
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true \
            -Dlinter.mathlibStandardSet=true roadmap/SuggestedInterfaces.lean
          lake env lean -DautoImplicit=false -Dlinter.mathlibStandardSet=true roadmap/Suggested.lean
          lake env lean -DautoImplicit=false -Dlinter.mathlibStandardSet=true \
            roadmap/SuggestedCompanions.lean

      # Toolchain in sync with InfinitaryLogic; no `sorry`; headers; every declaration in
      # the `VaughtConjecture` namespace uses only the standard axioms.
      - name: Audits
        run: bash scripts/check.sh --no-build
