name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELAN_VER: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  build:
    runs-on: ubuntu-latest
    # Mathlib is the cameronfreer/mathlib4 fork required by InfinitaryLogic, so the public
    # Mathlib cache misses the ~2100 modules downstream of the fork's changes.  Those, plus
    # InfinitaryLogic itself, are built once per dependency pin and then carried between runs
    # by the `deps` GitHub cache below; a cold run (new pin) is slow, a warm run takes minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install elan (pinned + checksum) and the toolchain
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      # Dependency outputs (`.lake/packages`: Mathlib fork, InfinitaryLogic,
      # ComputableModelTheory, and the small libraries), keyed on the two pins only.  Any
      # branch restores the newest cache for its pins; it is saved by whichever run first
      # builds a new pin.  A pull request's cache lives under `refs/pull/<n>/merge` and is
      # never visible to `main`, which saves its own after the merge; `main`'s caches are
      # visible to every pull request.
      # This step only looks the entry up (nothing is downloaded), so that the disk cleanup
      # below can be decided before anything is written to disk; the restore follows it.
      - name: Look up dependency cache
        id: deps-lookup
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: deps-v7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          lookup-only: true

      # Emits `enough=true` only if the measured available bytes are an integer of at least
      # 10.25 GiB (11005853696 bytes); a failed or unparseable measurement gives `enough=false`,
      # so the cleanup runs.  The comparison is first checked at and around the boundary.
      - name: Measure free disk space
        id: disk
        run: |
          df -h / || true
          enough() { [[ "$1" =~ ^[0-9]+$ ]] && (( 10#$1 >= 11005853696 )); }
          for t in 11005853695:false 11005853696:true 11005853697:true x:false :false; do
            if enough "${t%%:*}"; then got=true; else got=false; fi
            if [[ "$got" != "${t##*:}" ]]; then
              echo "disk guard self-test failed for '${t%%:*}'"; exit 1
            fi
          done
          avail=$(df --output=avail -B1 / 2>/dev/null | tail -n 1 | tr -d ' ') || avail=
          if enough "$avail"; then result=true; else result=false; fi
          echo "available bytes: ${avail:-unknown}; at least 10.25 GiB: $result"
          echo "enough=$result" >> "$GITHUB_OUTPUT"

      # The cold path (dependency cache missed) restores nothing and then fetches the Mathlib
      # cache of the pin and builds the dependencies, which needs the room, so the cleanup
      # always runs there, as before (the toolchain install above it is unaffected).
      # The warm path needs room for the restored dependency cache, pruned before it was saved
      # (see the step before "Save dependency cache"): a 1.8 GiB archive that is extracted to
      # about 6.4 GiB (both on disk during extraction, so a peak of about 8.2 GiB), plus about
      # 0.2 GiB of root build outputs; the sketch checks and audits write nothing large.  The
      # cleanup is therefore also run unless at least 10.25 GiB (the peak plus 2 GiB) is free,
      # and is skipped only on a hit with that much free (it takes about 2 minutes).  Runners
      # have reported about 10.4 GiB free at this point, below the 12 GiB the unpruned cache
      # (1.9 GiB archive, 7.7 GiB extracted) required.  The cleanup drops the large preinstalled
      # toolchains we never use.
      - name: Free disk space
        if: >-
          steps.deps-lookup.outputs.cache-hit != 'true' ||
          steps.disk.outputs.enough != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Same key as the look-up.  If the look-up found the entry but the restore does not
      # (evicted in between), fail rather than take the cold path without the cleanup above;
      # a re-run then takes the cold path with the cleanup.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: ${{ steps.deps-lookup.outputs.cache-primary-key }}
          fail-on-cache-miss: ${{ steps.deps-lookup.outputs.cache-hit == 'true' }}

      # The project's own outputs (`.lake/build`), keyed on the pins plus the exact commit,
      # with a prefix fallback to the most recent build for the same pins (the prefix includes
      # the hash of `lean-toolchain` and `lake-manifest.json`, so a build made against other
      # pins is never restored).  `lake build` re-checks every module's trace against its
      # inputs, so a stale restore only costs rebuilding the changed modules and never skips
      # a check.
      - name: Restore root build cache
        id: root-cache
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Only on a cold dependency cache: fetch the public Mathlib cache for the modules the
      # fork shares with upstream, then compile InfinitaryLogic, the classical entry module of
      # ComputableModelTheory, and the uncached Mathlib modules they need, so that
      # the saved dependency cache is complete.  (The main build only compiles what the library
      # imports, which would leave later runs rebuilding whatever this commit happened not to
      # import.)
      - name: Fetch Mathlib cache and build dependencies (cold dependency cache only)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          lake exe cache get
          lake build InfinitaryLogic
          lake build ComputableModelTheory.Classical

      - name: Build
        run: lake build

      # The classical entry module of ComputableModelTheory (its eight Mathlib-only classical
      # modules: representative ages, extension-rich families and direct limits, Fraïssé
      # existence, rooted extension, orbit isolation, countable prime structures, named
      # parameters) is built on every run, cache hit or not, so that a dependency cache saved
      # before it was advertised cannot leave the pinned interfaces unverified.
      - name: Build the classical entry module of ComputableModelTheory
        run: lake build ComputableModelTheory.Classical

      # Before saving, drop from the dependency tree what a warm run never reads.  A warm run
      # only checks each dependency module's trace and imports its `.olean`, `.olean.server`,
      # `.olean.private` and `.ir` (all read by `import` from a file outside the module system,
      # as ours and the sketches are), so those stay, with every `.trace` and `.hash`.
      #   * `*.setup.json` (in `.lake/build/ir`): the arguments Lake passed to Lean when it
      #     compiled the module; never read for an up-to-date module.  Deleted.
      #   * `.lake/build/bin` (Mathlib's `cache` executable): only `lake exe cache get` uses it,
      #     and that runs on the cold path alone, which restores nothing and rebuilds it.  Deleted.
      #   * `*.c` (generated C) and `*.ilean` (the language server's reference index): Lake
      #     treats a module as up to date only if these files exist, but takes their hashes from
      #     the `.hash` files beside them and never reads them, and nothing on the warm path
      #     compiles C or queries references.  They are therefore emptied, not deleted (deleting
      #     them makes Lake rebuild every dependency).
      # Measured on the pins of this cache key: 7.7 GiB on disk before, 6.4 GiB after; the
      # zstd archive 1.9 GiB before, 1.8 GiB after.  The tree is pruned in place, so the
      # run that saves it goes on to the sketch checks and the audits against the pruned tree.
      - name: Prune dependency outputs the warm path does not read
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          du -sh .lake/packages
          find .lake/packages -path '*/.lake/build/*' -type f -name '*.setup.json' -delete
          find .lake/packages -path '*/.lake/build/bin' -type d -prune -exec rm -rf {} +
          find .lake/packages -path '*/.lake/build/*' -type f \( -name '*.c' -o -name '*.ilean' \) \
            -size +0 -exec truncate -s 0 {} +
          du -sh .lake/packages

      # Save the dependency cache right after a successful build, before the sketch checks and
      # the audits, so a failure in either cannot discard a valid cache.
      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/packages
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Saved on every run whose exact key missed, pull requests included, so that successive
      # commits on one pull request rebuild only the changed modules.  GitHub scopes a cache to
      # the ref that saved it: a pull request's entries (ref `refs/pull/<n>/merge`) are
      # visible to later runs of that pull request only, never to `main` or to other pull
      # requests, while `main`'s entries are visible to every pull request.  The repository
      # limit is 10 GB, evicting least-recently-used entries.  An entry here is about 7.5 MB
      # compressed against 1.9 GB for a (pruned) dependency cache, so even with four dependency
      # caches present (7.7 GB) about 300 build entries fit; their pressure on the dependency
      # caches is negligible.
      - name: Save root build cache
        if: steps.root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: ${{ steps.root-cache.outputs.cache-primary-key }}

      # The roadmap's sketches are outside the library build but must keep elaborating against
      # the pinned dependencies (their `#check`s of upstream entry points fail on a pin bump
      # that removes one).  `Suggested.lean` and `SuggestedCompanions.lean` have deliberate
      # `sorry`s, so they are checked without warnings-as-errors.  Run after the cache saves, so a
      # failing sketch check cannot discard a freshly built dependency cache.
      - name: Check the roadmap sketches
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true \
            -Dlinter.mathlibStandardSet=true roadmap/SuggestedInterfaces.lean
          lake env lean -DautoImplicit=false -Dlinter.mathlibStandardSet=true roadmap/Suggested.lean
          lake env lean -DautoImplicit=false -Dlinter.mathlibStandardSet=true \
            roadmap/SuggestedCompanions.lean

      # Toolchain in sync with InfinitaryLogic; no `sorry`; headers; every declaration in
      # the `VaughtConjecture` namespace uses only the standard axioms.
      - name: Audits
        run: bash scripts/check.sh --no-build

      # Dependency manifest, for reproducible cleanup audits, generated from this checkout after
      # the build above: for the main theorem
      # `MainTheorem.densitySentence_hasThinAlephOneSpectrum_levels` and its components
      # (R2) `Realization.receivingResidualReceiving_of_padded`,
      # (R3) `Realization.hollowReceiving_levels`,
      # (R4) `Expansion.receivingStableCappedReceiving_levels` and
      # `StageType.hasLadderGrowthCarriersStableAtSeed_levels`, it records the commit, tree and
      # toolchain; each elaborated statement; each declaration dependency cone (what the proofs
      # use), with its library declarations, their modules and its axioms; and, separately, the
      # import closure of the top module (what is imported).  The step fails if a theorem name is
      # not found; its first command checks that on a deliberately wrong name.  The summary is
      # printed below and the full manifest is uploaded as the run's `dependency-manifest`
      # artifact (it is not committed).  Locally: `bash scripts/manifest.sh [OUT]`.
      - name: Dependency manifest
        run: |
          bash scripts/manifest.sh --test
          bash scripts/manifest.sh "$RUNNER_TEMP/dependency-manifest.txt"

      - name: Upload the dependency manifest
        uses: actions/upload-artifact@v7
        with:
          name: dependency-manifest
          path: ${{ runner.temp }}/dependency-manifest.txt
          if-no-files-found: error
          retention-days: 30

  # The Comparator check of `comparator/` (see `comparator/README.md`): the solution module
  # against the reference statement `comparator/Challenge.lean`, through Lean's kernel and
  # nanoda, with the three expected failures.  It runs after `build`, which has saved the
  # dependency cache for the current pins, and builds the root library from nothing: the root
  # build cache is deliberately not restored, so the check is of a clean build of the exact
  # commit.  `lake comparator`, `leanexport` and `nanoda_bin` come with the pinned toolchain.
  comparator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install elan (pinned + checksum) and the toolchain
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      # bubblewrap for the sandboxes of `check.sh` and of `lake comparator`; Ubuntu's runners
      # restrict unprivileged user namespaces through AppArmor, which bubblewrap needs.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # The dependency cache saved by `build` for the current pins (same key); no root build
      # cache is restored.
      - name: Restore dependency cache
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: deps-v7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          fail-on-cache-miss: true

      - name: Clean build of the root library
        run: |
          test ! -e .lake/build
          lake build

      - name: Comparator check
        run: bash comparator/check.sh "$RUNNER_TEMP/comparator"

      - name: Upload the Comparator logs and hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparator-check
          path: |
            ${{ runner.temp }}/comparator/logs
            ${{ runner.temp }}/comparator/*.txt
            ${{ runner.temp }}/comparator/*.tsv
            ${{ runner.temp }}/comparator/*SHA256SUMS
            ${{ runner.temp }}/comparator/challenge-declarations.lean
          if-no-files-found: warn
          retention-days: 30
