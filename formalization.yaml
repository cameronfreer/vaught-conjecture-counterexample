# formalization.yaml (v0.4): repo-root metadata for this formalization.
# What the repository already encodes (toolchain, pins, CI, history) is not repeated here.

version: "v0.4"

project:
  name: "Formalization of a counterexample to Vaught's conjecture for L_{ω₁ω}"
  description: >-
    A Lean 4 proof that a sentence of the infinitary logic L_{ω₁ω}, in a countable relational
    language, has exactly ℵ₁ countable models up to isomorphism and no perfect set of pairwise
    non-isomorphic countable models. It is a counterexample to Vaught's conjecture for L_{ω₁ω},
    not to the first-order Vaught conjecture. The main theorem is proved with no hypotheses for
    the repository's own sentence, `baseLanguage.densitySentence`, following the construction of
    the manuscript; the formalization does not formalize every claim of the manuscript, and it
    does not identify the models of that sentence with the manuscript's class of strongly coded
    templates.
  authors:
    - Nathanael Ackerman
    - Cameron Freer
    - Robin Knight
  responsible_maintainers:
    - Cameron Freer
  license: Apache-2.0

sources:
  - title: "A counterexample to Vaught's Conjecture for L_{ω₁,ω}"
    authors:
      - Nathanael L. Ackerman
      - Cameron Freer
      - Robin W. Knight
    id: "https://hexagonmath.org/2610.00188"
    type: article
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The initial paper [AFK26] (entry `AFK26` of `roadmap/REFERENCES.bib`), which explains the
      proof strategy and many details. The formalization proves the stated theorem for its own
      sentence following the paper's construction; it does not formalize every claim of the
      paper. A fuller account of the proof will follow.
  - title: "A counterexample to Vaught's Conjecture using generalised Stone spaces"
    authors:
      - Robin W. Knight
    type: unpublished-draft
    relationship: adapts
    author_endorsement: participated
    note: >-
      Unpublished draft of 20 February 2026 (entry `Kni26` of `roadmap/REFERENCES.bib`), not
      public. The construction and the proof strategy were adapted from this draft; new ideas
      developed through human–AI interaction entered the formalization.

related_formalizations:
