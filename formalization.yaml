    relationship: builds-on
    note: >-
      Infinitary model theory (syntax, satisfaction, Scott analysis, codes of countable models),
      pinned in `lake-manifest.json`.
  - id: https://github.com/cameronfreer/computable-model-theory
    relationship: builds-on
    note: >-
      Classical model-theoretic infrastructure (Fraïssé limits and related constructions),
      pinned in `lake-manifest.json`.
  - id: https://github.com/cameronfreer/vaught-conjecture-palomar
    relationship: other
    note: >-
      The earlier formalization of the same theorem by the same authors, registered separately
      as Palomar entry PALOMAR-2026-10-07-000001 at commit
      032ccb7a25b0ff6227128aa0aeba549c5901ea9a (theorem `PalomarChallenge.independent_challenge`).
      This repository does not depend on it, and that registration does not extend to this
      repository. The two share the Comparator reference statement: the declarations of
      `comparator/Challenge.lean` here are, after removing comments and docstrings, character
      for character those of that entry's `Palomar/Challenge.lean`.

classification:
  arxiv:
    - math.LO
  msc2020:
    - "03C15"
    - "03C75"
    - "03E15"

status:
  scope: >-
    The main theorem is proved with no hypotheses and depends only on the three standard axioms.
    CI runs the build, the library-wide axiom audit (`scripts/check.sh`) and the dependency
    manifest (`scripts/manifest.sh`) on pull requests and pushes to `main`. Comparator
    (`comparator/`) replays the reference proof through the Lean kernel and nanoda on pull
    requests; `main` pushes and manual runs additionally use a fresh root-library build.
    Placeholder counts below concern the proof library under `VaughtConjecture/`; deliberate
    roadmap sketches, the Comparator reference hole and the expected-failure fixtures are
    outside that count. The
    annotated tag `main-theorem-2026-10-11` (commit b00bb878b12a1ef75b9aecf1ef5a1e6577645ff4,
    notes in `milestones/2026-10-11-main-theorem.md`) is a historical reference to one verified
    commit; later commits are verified by their own CI runs and do not inherit that
    verification. The formal counterparts of Propositions 4.32, 4.34 and 4.35, Lemma 4.33,
    Claim 4.37 and Theorem 4.36 of [AFK26] for the strongly coded template system are proved,
    relative to the current draft of 7 October 2026 (`alignment`); Theorem 4.36 is proved for the
    models of `templateSentence` coded on ℕ, as the concrete template-system specialization of
    the route of Section 2 of [AFK26], not as the abstract Theorems 2.25 and 2.27 for arbitrary
    systems.
    Open mathematics outside the main theorem (the hypotheses (R1) and (R2) for every model, and
    other correspondence questions) is recorded in `roadmap/`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: MainTheorem.densitySentence_hasThinAlephOneSpectrum_levels
      file: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
    - declaration: MainTheorem.vaughtCounterexample_allCarriers_densitySentence
      file: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
    - declaration: PalomarChallenge.independent_challenge
      file: comparator/Solution.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
      comparator_config: comparator/comparator.json

automation:
  methods:
    - method: manual
      tool_setup: "Human mathematical collaboration and direction of the formalization."
    - method: agent
      models:
        - "GPT-5.2 through GPT-6"
        - "Claude Opus 4.5 through Fable 5.1 and Opus 5.5"
      framework: "Claude Code and Codex"
      tool_setup: >-
        GPT models from 5.2 through 6 and Claude models from Opus 4.5 through Fable 5.1 and
        Opus 5.5. Initially used for proof implementation
        following the manuscript; later models were also used for mathematical exploration,
        counterexample search, refactoring, documentation, and review.
  notes: >-
    SMT and Horn solvers were used in the course of finding the proof, but do not play a role
    in the final formalization.

fidelity:
  divergences: >-
    The theorem is proved for the repository's own sentence, `baseLanguage.densitySentence`,
    constructed following the manuscript; the formalization does not identify its models with
    the manuscript's strongly coded templates, and several intermediate statements of the
    manuscript are not formalized. Propositions 4.32, 4.34 and 4.35, Lemma 4.33, Claim 4.37 and
    Theorem 4.36 of [AFK26] are formalized and proved for the strongly coded template system, its
    classes `K_β` and the repository's transcription `templateSentence` of its sentence, relative
    to the current draft of 7 October 2026; Theorem 4.36 for the models of `templateSentence`
    coded on ℕ (the statement on all countable carriers is not made: the empty structure satisfies
    `templateSentence`), as the concrete specialization of the route of Section 2 of [AFK26], whose
    abstract Theorems 2.25 and 2.27 for arbitrary systems are not formalized.
    `templateSentence` is not identified with `baseLanguage.densitySentence`, and no spectrum
    result is transferred between them. Where the
    formal route differs from the manuscript (for example, receiving models in place of
    hypotheses on every model), the roadmap records the difference next to the named
    declarations.

review:
  status: agent-reviewed
  notes: >-
    Human mathematical direction, with agent-assisted implementation and review of every change
    before merge. Mechanical checks in CI, on pull requests and pushes to `main`: a full build
    with warnings as errors, a placeholder scan, a library-wide audit that every declaration
    depends only on the three standard axioms, a dependency manifest for the main theorem, and
    the Comparator replay of the reference statement (Lean kernel and nanoda, with
    expected-failure cases); `main` pushes and manual runs additionally use a fresh root-library
    build for the Comparator check. No human peer review of the
    formalization is claimed, and no Palomar registration is claimed for this repository.

alignment:
  namespace: VaughtConjecture
  statements:
    - source: "[AFK26], main theorem"
      lean: MainTheorem.densitySentence_hasThinAlephOneSpectrum_levels
      module: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      status: proved
      note: "For the repository's own sentence; no hypotheses."
    - source: "[AFK26], main theorem on all countable carriers"
      lean: MainTheorem.vaughtCounterexample_allCarriers_densitySentence
      module: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      status: proved
      note: "Exactly ℵ₁ isomorphism classes, no perfect set of pairwise non-isomorphic models, no finite models."
    - source: "Comparator reference statement `PalomarChallenge.independent_challenge`"
      lean: PalomarChallenge.independent_challenge
      module: comparator/Solution.lean
      status: proved
      note: "Stated in `comparator/Challenge.lean` with Mathlib-only imports; proved from the main theorem."
    - source: "[AFK26], Proposition 4.32"
      lean:
        - IsTemplateChart.hereditary
        - IsTemplateChart.jointEmbedding
        - IsTemplateChart.amalgamation
      module: VaughtConjecture/Correspondence/Charts/Chart.lean
      status: proved
      note: >-
        The hereditary (for nonempty closed sets), joint embedding and amalgamation properties of
        the charts `C_β[L]` of the strongly coded template system; joint embedding and
        amalgamation for `β < ω₁`. Relative to the current draft of [AFK26] of 7 October 2026
        (not part of this repository; SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version.
    - source: "[AFK26], Proposition 4.34"
      lean: proposition434Target
      module: VaughtConjecture/Correspondence/Proposition434.lean
      status: proved
      note: >-
        Boundedness, Reconstruction and Limits (at nonzero limits) for the classes `K_β` of the
        strongly coded template system (`templateStageClass`) and the sentence `templateSentence`,
        on countable nonempty carriers, for `β < ω₁`. The three clauses hold without the sentence
        premise and without nonemptiness, as `proposition434Clauses_of_countable`; level zero is
        the separate theorem `exists_lift_zero_of_realize_templateSentence`. Rank is the least
        projection-fixing stage, not Scott rank. Relative to the current draft of [AFK26] of
        7 October 2026 (SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version; `templateSentence` is not identified with `baseLanguage.densitySentence`, and no
        spectrum result is transferred between them. Notes in
        `milestones/2026-10-15-proposition-4-34.md`.
    - source: "[AFK26], Proposition 4.35"
      lean: proposition435Target
      module: VaughtConjecture/Correspondence/Maximality/Count.lean
      status: proved
      note: >-
        For `β < ω₁`, a countable set of structures on ℕ, each maximal at `β` (the printed
        Definition 2.20, `IsMaximalAt`, with its allowance for an unchanged higher lift), such that
        every structure maximal at `β` on a countable nonempty carrier is isomorphic to one of them
        in the full template language. The stronger `maximalCountTarget` drops nonemptiness. The
        native count of strongly coded terminal realizations
        (`Realization.stronglyCodedTerminalClasses_countable`) is an input, distinct from this
        proposition. Relative to the current draft of [AFK26] of 7 October 2026 (SHA-256 of its
        source 654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a
        published version; no spectrum result is transferred to `baseLanguage.densitySentence`.
    - source: "[AFK26], Lemma 4.33"
      lean: universalChartModelTarget
      module: VaughtConjecture/Correspondence/Charts/UniversalTheorem.lean
      status: proved
      note: >-
        For `β < ω₁` and a countable infinite carrier, one structure of the class `K_β` of the
        strongly coded template system (`templateStageClass`), chosen before any chart is named,
        into which every chart of `C_β[L]` embeds, and over which every chart embedding extends
        every embedding of its root, with a commuting square and exact realization of the chart;
        the empty root is a separate clause. Built positionally
        (`stronglyCodedUniversalRealizationTarget`) and read through its classes
        (`stronglyCodedUniversalReadingTarget`), without a previously given class realization with
        donor density; density at every cutoff below the block stage follows from universality
        (`universalityDensityTarget`). Relative to the current draft of [AFK26] of 7 October 2026
        (SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version.
    - source: "[AFK26], Claim 4.37 (in the proof of Theorem 4.36) and Definition 2.21"
      lean:
        - sentenceMaximalLiftTarget
        - sentenceEventualDeterminationTarget
      module: VaughtConjecture/Correspondence/Maximality/Completion.lean
      status: proved
      note: >-
        Every model of `templateSentence` on a countable nonempty carrier has exactly one maximal
        lift in the classes `K_β` of the strongly coded template system, and every closed tuple of
        it is eventually determined (Definition 2.21) at a least threshold with an actual lift,
        for every lift at a stage `ζ` with `ξ ≤ ζ` (the printed clause has `ζ > ξ`). From the
        greatest lift stage (`greatestLiftStageTarget`), the maximal completion of every member of
        `K_β`, `β < ω₁`, on a countable carrier (`maximalCompletionTarget`), its uniqueness across
        stages (`maximalLiftUniqueTarget`, `maximalCompletionUniqueTarget`) and lower lifts as its
        projections (`lowerLiftsAreProjectionsTarget`); no rank is identified with a stage.
        Theorem 4.36 for `templateSentence` is the entry below. Relative to the
        current draft of [AFK26] of 7 October 2026 (SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version; `templateSentence` is not identified with `baseLanguage.densitySentence`, and no
        spectrum result is transferred between them.
    - source: "[AFK26], Definition 2.23 (a)–(d), for the strongly coded template system"
      lean:
        - templateSystemConditionsTarget
        - maximalCoverageTarget
        - uniformMaximalRepresentativesTarget
        - attainedEventualDeterminationTarget
        - invariantOccurrenceTarget
      module: VaughtConjecture/Correspondence/TemplateSystem/Conditions.lean
      status: proved
      note: >-
        The four conditions of the manuscript's Knight system for the classes `K_β` of the
        strongly coded template system (`templateStageClass`), bundled as
        `templateSystemConditionsTarget`: (a) maximal coverage, every member of `K_β`, `β < ω₁`,
        on a countable carrier is the projection of a structure maximal at a level `γ ≥ β`
        (`maximalCoverageTarget`); (b) one family of countable sets of structures on ℕ maximal at
        `β`, representing every structure maximal at `β` on a countable carrier up to isomorphism
        in the full template language (`uniformMaximalRepresentativesTarget`; no globally
        countable family); (c) eventual determination of every closed tuple of positive arity of
        a member of the base at an attained threshold (`attainedEventualDeterminationTarget`);
        (d) every invariant of a legal class occurs in a universal chart model on every countably
        infinite carrier (`invariantOccurrenceTarget`, through Lemma 4.33). The weak-system
        clauses of Theorem 4.23 are separate (`weakSystemClausesTarget`,
        `templateInvariantSystemTarget`, `templateBaseModelsTarget`, in
        `VaughtConjecture/Correspondence/TemplateSystem/WeakSystem.lean`). Relative to the current
        draft of [AFK26] of 7 October 2026 (SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version.
    - source: "[AFK26], Theorem 4.36"
      lean:
        - theorem436Target
        - templateSentenceAlephOneTarget
        - thinnessTarget
      module: VaughtConjecture/Correspondence/TemplateSystem/BackAndForth.lean
      status: proved
      note: >-
        `theorem436Target : Theorem436Target`, where
        `Theorem436Target := MainTheorem.HasThinAlephOneSpectrum templateSentence.{0}`
        (`VaughtConjecture/Correspondence/TemplateSystem/Theorem436.lean`), for the models of
        `templateSentence` coded on ℕ. Two distinct conclusions: the count, exactly ℵ₁
        isomorphism classes of models coded on ℕ (`templateSentenceAlephOneTarget`, in
        `VaughtConjecture/Correspondence/TemplateSystem/AlephOne.lean`), through the rank
        `maximalStageOfClass`, defined using the greatest lift stage rather than the least
        projection-fixing stage; and thinness, no perfect set of pairwise non-isomorphic models
        coded on ℕ (`thinnessTarget`), from countably many back-and-forth classes at every level
        below ω₁ (`countableBFClassesTarget`, through the back-and-forth core
        `backAndForthCoreTarget`) and `MainTheorem.isThinOnNatModels_of_countable_bfClasses`.
        Inputs: Definition 2.23 (a)–(d) (`templateSystemConditionsTarget`, the entry above), the
        weak-system interface (`templateInvariantSystemTarget`,
        `templateInvariantSystem_projection`, `weakSystemClausesTarget`,
        `projectedDensityAt_of_satisfiesDensityAt`, `templateBaseModelsTarget`) and the
        countability of the language (`baseLanguageCountableTarget`). The concrete
        template-system specialization of the route of Section 2 of [AFK26]; the abstract
        Theorems 2.25 and 2.27 for arbitrary systems are not claimed. The statement on all
        countable carriers is not made (the empty structure satisfies `templateSentence`); the
        passage to countable nonempty carriers is `nonemptyCarrierPassageTarget`, with
        `templateModelInfiniteTarget`. The theorem concerns `templateSentence` separately from,
        and without reference to, `MainTheorem.densitySentence_hasThinAlephOneSpectrum_levels`;
        no spectrum result is transferred between the two sentences. Relative to the current
        draft of [AFK26] of 7 October 2026 (SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version.

