# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for this formalization.
# What the repository already encodes (toolchain, pins, CI, history) is not repeated here.

version: "v0.4"

project:
  name: "Formalization of a counterexample to Vaught's conjecture for L_{ω₁ω}"
  description: >-
    A Lean 4 proof that a sentence of the infinitary logic L_{ω₁ω}, in a countable relational
    language, has exactly ℵ₁ countable models up to isomorphism and no perfect set of pairwise
    non-isomorphic countable models. It is a counterexample to Vaught's conjecture for L_{ω₁ω},
    not to the first-order Vaught conjecture. The main theorem is proved with no hypotheses for
    the repository's own sentence, `baseLanguage.densitySentence`, following the construction of
    the manuscript; the formalization does not formalize every claim of the manuscript, and it
    does not identify the models of that sentence with the manuscript's class of strongly coded
    templates.
  authors:
    - Nathanael Ackerman
    - Cameron Freer
    - Robin Knight
  responsible_maintainers:
    - Cameron Freer
  license: Apache-2.0

sources:
  - title: "A counterexample to Vaught's Conjecture for L_{ω₁,ω}"
    authors:
      - Nathanael L. Ackerman
      - Cameron Freer
      - Robin W. Knight
    id: "https://hexagonmath.org/2610.00188"
    type: article
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The initial paper [AFK26] (entry `AFK26` of `roadmap/REFERENCES.bib`), which explains the
      proof strategy and many details. The formalization proves the stated theorem for its own
      sentence following the paper's construction; it does not formalize every claim of the
      paper. A fuller account of the proof will follow.
  - title: "A counterexample to Vaught's Conjecture using generalised Stone spaces"
    authors:
      - Robin W. Knight
    type: unpublished-draft
    relationship: adapts
    author_endorsement: participated
    note: >-
      Unpublished draft of 20 February 2026 (entry `Kni26` of `roadmap/REFERENCES.bib`), not
      public. The construction and the proof strategy were adapted from this draft; new ideas
      developed through human–AI interaction entered the formalization.

related_formalizations:
  - id: https://github.com/cameronfreer/infinitary-logic
    relationship: builds-on
    note: >-
      Infinitary model theory (syntax, satisfaction, Scott analysis, codes of countable models),
      pinned in `lake-manifest.json`.
  - id: https://github.com/cameronfreer/computable-model-theory
    relationship: builds-on
    note: >-
      Classical model-theoretic infrastructure (Fraïssé limits and related constructions),
      pinned in `lake-manifest.json`.
  - id: https://github.com/cameronfreer/vaught-conjecture-palomar
    relationship: other
    note: >-
      The earlier formalization of the same theorem by the same authors, registered separately
      as Palomar entry PALOMAR-2026-10-07-000001 at commit
      032ccb7a25b0ff6227128aa0aeba549c5901ea9a (theorem `PalomarChallenge.independent_challenge`).
      This repository does not depend on it, and that registration does not extend to this
      repository. The two share the Comparator reference statement: the declarations of
      `comparator/Challenge.lean` here are, after removing comments and docstrings, character
      for character those of that entry's `Palomar/Challenge.lean`.

classification:
  arxiv:
    - math.LO
  msc2020:
    - "03C15"
    - "03C75"
    - "03E15"

status:
  scope: >-
    The main theorem is proved with no hypotheses and depends only on the three standard axioms.
    CI runs the build, the library-wide axiom audit (`scripts/check.sh`) and the dependency
    manifest (`scripts/manifest.sh`) on pull requests and pushes to `main`. Comparator
    (`comparator/`) replays the reference proof through the Lean kernel and nanoda on pull
    requests; `main` pushes and manual runs additionally use a fresh root-library build.
    Placeholder counts below concern the proof library under `VaughtConjecture/`; deliberate
    roadmap sketches, the Comparator reference hole and the expected-failure fixtures are
    outside that count. The
    annotated tag `main-theorem-2026-10-11` (commit b00bb878b12a1ef75b9aecf1ef5a1e6577645ff4,
    notes in `milestones/2026-10-11-main-theorem.md`) is a historical reference to one verified
    commit; later commits are verified by their own CI runs and do not inherit that
    verification. The formal counterparts of Propositions 4.32, 4.34 and 4.35 of [AFK26] for the
    strongly coded template system are proved, relative to the current draft of 7 October 2026
    (`alignment`). Open mathematics outside the main theorem (the hypotheses (R1) and (R2) for
    every model, and other correspondence questions) is recorded in `roadmap/`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: MainTheorem.densitySentence_hasThinAlephOneSpectrum_levels
      file: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
    - declaration: MainTheorem.vaughtCounterexample_allCarriers_densitySentence
      file: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
    - declaration: PalomarChallenge.independent_challenge
      file: comparator/Solution.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
      comparator_config: comparator/comparator.json

automation:
  methods:
    - method: manual
      tool_setup: "Human mathematical collaboration and direction of the formalization."
    - method: agent
      models:
        - "GPT-5.2 through GPT-6"
        - "Claude Opus 4.5 through Fable 5.1 and Opus 5.5"
      framework: "Claude Code and Codex"
      tool_setup: >-
        GPT models from 5.2 through 6 and Claude models from Opus 4.5 through Fable 5.1 and
        Opus 5.5. Initially used for proof implementation
        following the manuscript; later models were also used for mathematical exploration,
        counterexample search, refactoring, documentation, and review.
  notes: >-
    SMT and Horn solvers were used in the course of finding the proof, but do not play a role
    in the final formalization.

fidelity:
  divergences: >-
    The theorem is proved for the repository's own sentence, `baseLanguage.densitySentence`,
    constructed following the manuscript; the formalization does not identify its models with
    the manuscript's strongly coded templates, and several intermediate statements of the
    manuscript are not formalized. Propositions 4.32, 4.34 and 4.35 of [AFK26] are formalized
    and proved for the strongly coded template system, its classes `K_β` and the repository's
    transcription `templateSentence` of its sentence, relative to the current draft of
    7 October 2026; `templateSentence` is not identified with `baseLanguage.densitySentence`,
    and no spectrum result is transferred between them. Where the formal route differs from the
    manuscript (for example, receiving models in place of hypotheses on every model), the roadmap
    records the difference next to the named declarations.

review:
  status: agent-reviewed
  notes: >-
    Human mathematical direction, with agent-assisted implementation and review of every change
    before merge. Mechanical checks in CI, on pull requests and pushes to `main`: a full build
    with warnings as errors, a placeholder scan, a library-wide audit that every declaration
    depends only on the three standard axioms, a dependency manifest for the main theorem, and
    the Comparator replay of the reference statement (Lean kernel and nanoda, with
    expected-failure cases); `main` pushes and manual runs additionally use a fresh root-library
    build for the Comparator check. No human peer review of the
    formalization is claimed, and no Palomar registration is claimed for this repository.

alignment:
  namespace: VaughtConjecture
  statements:
    - source: "[AFK26], main theorem"
      lean: MainTheorem.densitySentence_hasThinAlephOneSpectrum_levels
      module: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      status: proved
      note: "For the repository's own sentence; no hypotheses."
    - source: "[AFK26], main theorem on all countable carriers"
      lean: MainTheorem.vaughtCounterexample_allCarriers_densitySentence
      module: VaughtConjecture/MainTheorem/GrowthLevelRoute.lean
      status: proved
      note: "Exactly ℵ₁ isomorphism classes, no perfect set of pairwise non-isomorphic models, no finite models."
    - source: "Comparator reference statement `PalomarChallenge.independent_challenge`"
      lean: PalomarChallenge.independent_challenge
      module: comparator/Solution.lean
      status: proved
      note: "Stated in `comparator/Challenge.lean` with Mathlib-only imports; proved from the main theorem."
    - source: "[AFK26], Proposition 4.32"
      lean:
        - IsTemplateChart.hereditary
        - IsTemplateChart.jointEmbedding
        - IsTemplateChart.amalgamation
      module: VaughtConjecture/Correspondence/Charts/Chart.lean
      status: proved
      note: >-
        The hereditary (for nonempty closed sets), joint embedding and amalgamation properties of
        the charts `C_β[L]` of the strongly coded template system; joint embedding and
        amalgamation for `β < ω₁`. Relative to the current draft of [AFK26] of 7 October 2026
        (not part of this repository; SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version.
    - source: "[AFK26], Proposition 4.34"
      lean: proposition434Target
      module: VaughtConjecture/Correspondence/Proposition434.lean
      status: proved
      note: >-
        Boundedness, Reconstruction and Limits (at nonzero limits) for the classes `K_β` of the
        strongly coded template system (`templateStageClass`) and the sentence `templateSentence`,
        on countable nonempty carriers, for `β < ω₁`. The three clauses hold without the sentence
        premise and without nonemptiness, as `proposition434Clauses_of_countable`; level zero is
        the separate theorem `exists_lift_zero_of_realize_templateSentence`. Rank is the least
        projection-fixing stage, not Scott rank. Relative to the current draft of [AFK26] of
        7 October 2026 (SHA-256 of its source
        654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a published
        version; `templateSentence` is not identified with `baseLanguage.densitySentence`, and no
        spectrum result is transferred between them. Notes in
        `milestones/2026-10-15-proposition-4-34.md`.
    - source: "[AFK26], Proposition 4.35"
      lean: proposition435Target
      module: VaughtConjecture/Correspondence/Maximality/Count.lean
      status: proved
      note: >-
        For `β < ω₁`, a countable set of structures on ℕ, each maximal at `β` (the printed
        Definition 2.20, `IsMaximalAt`, with its allowance for an unchanged higher lift), such that
        every structure maximal at `β` on a countable nonempty carrier is isomorphic to one of them
        in the full template language. The stronger `maximalCountTarget` drops nonemptiness. The
        native count of strongly coded terminal realizations
        (`Realization.stronglyCodedTerminalClasses_countable`) is an input, distinct from this
        proposition. Relative to the current draft of [AFK26] of 7 October 2026 (SHA-256 of its
        source 654b2780d08e9aee902d0553576c8f58f82730ccba7f4926757e45b1c02a755f), not to a
        published version; no spectrum result is transferred to `baseLanguage.densitySentence`.

acknowledgements: >-
  Built on Mathlib and the pinned InfinitaryLogic and ComputableModelTheory developments; the
  reference statement and checking workflow follow the Comparator tool (leanprover/comparator).
