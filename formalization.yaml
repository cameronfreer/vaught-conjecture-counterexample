status:
  scope: >-
    The main theorem is proved with no hypotheses and depends only on the three standard axioms.
    CI runs the build, the library-wide axiom audit (`scripts/check.sh`) and the dependency
    manifest (`scripts/manifest.sh`) on pull requests and pushes to `main`. Comparator
    (`comparator/`) replays the reference proof through the Lean kernel and nanoda on pull
    requests; `main` pushes and manual runs additionally use a fresh root-library build.
    Placeholder counts below concern the proof library under `VaughtConjecture/`; deliberate
    roadmap sketches, the Comparator reference hole and the expected-failure fixtures are
    outside that count. The
    annotated tag `main-theorem-2026-10-11` (commit b00bb878b12a1ef75b9aecf1ef5a1e6577645ff4,
    notes in `milestones/2026-10-11-main-theorem.md`) is a historical reference to one verified
    commit; later commits are verified by their own CI runs and do not inherit that
    verification. The formal counterparts of Propositions 4.32, 4.34 and 4.35, Lemma 4.33,
    Claim 4.37 and Theorem 4.36 of [AFK26] for the strongly coded template system are proved,
    relative to the current draft of 7 October 2026 (`alignment`); Theorem 4.36 is proved for the
    models of `templateSentence` coded on ℕ, as the concrete template-system specialization of
    the route of Section 2 of [AFK26], and a second time, separately, by that route: Proposition
    2.18 and Theorems 2.19, 2.25 and 2.27 are proved for arbitrary weak and qualifying systems
    (Theorem 2.27 in a form coded on ℕ, under the explicit premise that the members on countable
    carriers are infinite) and applied to `K[L]` as an instance.
    Open mathematics outside the main theorem (the hypotheses (R1) and (R2) for every model, and
    other correspondence questions) is recorded in `roadmap/`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
