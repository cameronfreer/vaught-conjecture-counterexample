name = "VaughtConjecture"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math", "model theory", "infinitary logic", "vaught conjecture"]
defaultTargets = ["VaughtConjecture"]
# A pure Lean package: cached module outputs are reusable across platforms.
platformIndependent = true

# The only pins are `lean-toolchain` and the four revisions below.  Mathlib and TauCeti are
# required directly at fixed revisions (the last two `require`s; Mathlib last, since Lake resolves
# the later `require`s first and the dependencies of Mathlib, such as aesop and batteries, must
# come from Mathlib's manifest, not from TauCeti's): Mathlib at upstream
# `leanprover-community/mathlib4` `2e318fa`, the Mathlib that InfinitaryLogic's and
# ComputableModelTheory's own manifests pin, and TauCeti at `330da7f`, which overrides the
# `971a6dd` of InfinitaryLogic's manifest.  These root pins govern: a bump of InfinitaryLogic no
# longer moves Mathlib or TauCeti, which move only when their own `rev` is changed, and the
# toolchain must equal InfinitaryLogic's (checked by `scripts/check.sh`).  To bump InfinitaryLogic:
# change its `rev`, run `lake update InfinitaryLogic`, copy its `lean-toolchain`, check that the
# Mathlib and TauCeti pins below still fit it, and commit the manifest (when its toolchain and
# Mathlib are unchanged, the `rev` and `inputRev` of the manifest may instead be edited by hand, as
# for earlier repins).
# Pinned to cameronfreer/infinitary-logic's release v7.0.0 (`004f638`: upstream Mathlib `2e318fa`,
# TauCeti `971a6dd` and Lean v4.36.0-rc1), which contains its release v6.1.0, the merge commit of
# its #172 (the
# per-level Silver step of `Conditional/MorleyPerfect` as one lemma), which includes #171
# (`BoundedFormulaω.realize_equiv` moved to `Lomega1omega/Semantics` and `modelsOf_mem_iff_of_equiv`
# to `Descriptive/SatisfactionBorel`, same names and statements), #170 and #165 (the greatest
# attained countable stage, `OrdinalUtil`), #169 (Scott separation: strict stage bounds from an
# isolating observation, and countable quantifier rank), #168 and #164 (counting for scattered
# classes), #167 and #166 (minimally uncountable and minimally unbounded classes), #163
# (concentration at back-and-forth levels), #162 (a countable isolating level for a countable family
# of countable structures), #161 (stage projections, the label rank
# and uniform fixation, `StageProjection.exists_uniform_fixing_stage`), #160 (cross-rank comparisons
# and the derived `+ ω` bounds), #159 (quantifier-rank bounds for Montalbán's Scott sentences), #158
# (eliminating orbit parameters), #157 (thinness from countable back-and-forth observations), #156
# (infinitary orbit formulas bound orbit ranks and the internal Scott rank, and a Scott sentence of
# bounded rank recognizes its model at that rank), #155 (the rank conventions documented, with the
# pure-set regression), #153 (thinness from countably many back-and-forth classes at every level),
# #154 (`Perfect.mk_eq_continuum` in the topology-only module `Topology/Perfect`), #151 (the
# isomorphism-transport lemmas placed below the Karp modules), #152 (graded matching families give
# back-and-forth equivalence), #150 (rank tails and the least level of a cover), #149 (forgetting
# finitely many parameters: Σ^in_α orbits over parameters give a Σ^in_{α+2} Scott sentence), #148
# (Montalbán's Scott sentence of Σ^in_α orbit formulas is Π^in_{α+1}), #147 (Montalbán's explicit
# Scott sentence from a family of orbit formulas), #146 (analytic-set closure lemmas in a neutral
# module), #145 (the ordinal-indexed Σ^in/Π^in hierarchy), #144 (analytic isomorphism-free sets of
# pairs are uniformly separated at a countable back-and-forth level, with #142 and #143), #141
# (orbit-formula thresholds and local-automorphism preservation), #140, #134 and the Lean 4.35.0-rc3
# port (#130).
[[require]]
name = "InfinitaryLogic"
git = "https://github.com/cameronfreer/infinitary-logic"
rev = "004f63817589d1308c834d2511576bbb173b50ef"

# Classical first-order model theory (Fraïssé limits, atomic and prime structures).  Its own
# manifest pins the InfinitaryLogic revision above; this
# manifest's pin governs.  To bump: change `rev`, run `lake update ComputableModelTheory`, and
# commit the manifest.
# Pinned to cameronfreer/computable-model-theory at the merge of its #59 (its InfinitaryLogic repin
# to the infinitary-logic release v7.0.0: upstream Mathlib, TauCeti and Lean v4.36.0-rc1), which
# includes #58 (its InfinitaryLogic repin to the release v6.0.0, `6480603`; no declaration changed),
# #57
# (the audit of finite diagrams against rooted extension), #56 and #55 (its InfinitaryLogic repins
# to infinitary-logic `9ab398a` and `def5cc0`), #54 (attachments and their transport along
# connecting data), #53 (the audit of finite elimination), #52 (finite elimination: the fixed-prefix
# selection lemma), #51 (its InfinitaryLogic repin to the merge of infinitary-logic#148), #50 and
# #48 (its earlier InfinitaryLogic repins), the seeded effective back-and-forth (computable
# automorphisms extending an isomorphism between finitely generated substructures of a computably
# homogeneous structure), #47, #46 (isolation and primeness over named finite parameters), #45 (the
# classical entry module `ComputableModelTheory.Classical`), #44 (classical Fraïssé existence: a
# Fraïssé sequence, its limit, and `IsFraisse K → ∃ limit`), #42 (rooted universality and
# uniqueness), #41, #40, #39, #38 and #37.
[[require]]
name = "ComputableModelTheory"
git = "https://github.com/cameronfreer/computable-model-theory"
rev = "5d5f65cef1e47776f0e3e60b3bacfda507f00aed"

# Infinitary syntax and semantics (`BoundedFormulaInf`, `Realize`), required directly to override
# the revision `971a6dd` of InfinitaryLogic's manifest.  Pinned to TauCetiProject/TauCeti `330da7f`
# (the merge of its #21452, which exposes the body of `BoundedFormulaInf.Realize`, so that its
# matcher has the public name `BoundedFormulaInf.Realize.match_1`), taken with the Mathlib
# `2e318fa` below, which differs from the Mathlib `2cabef9` recorded in TauCeti's own manifest at
# that commit.  Compatibility verification is pending (see `README.md`).
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "330da7fe53677e67643acface66a2ed799c37088"

# Mathlib, required directly so that the root pin governs every resolution: upstream mathlib4
# `2e318fa`, the revision InfinitaryLogic's and ComputableModelTheory's own manifests pin.  Without
# it, a resolution reaching TauCeti first takes the Mathlib of TauCeti's manifest (`2cabef9`).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2e318faecff7d70d4e0cf8cc875104424a737355"

# Authoritative: every module under `VaughtConjecture/` is built whether or not the root re-exports it,
# so an orphan file cannot escape the build or the audits.  The root `VaughtConjecture.lean` is
# intentionally empty and nothing imports it.
[[lean_lib]]
name = "VaughtConjecture"
globs = ["VaughtConjecture.*"]
# Mathlib's linter set, a 1500-line ceiling per file, and warnings as errors.  Both `longFile`
# and `longFileDefValue` must agree, or the linter nags on every short file.
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, pp.unicode.fun = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, warningAsError = true }
